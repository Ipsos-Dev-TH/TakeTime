# =============================================================================
# TakeTime Platform - Docker Compose DEVELOPMENT Override
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Features over production:
#   - Debug ports exposed for remote debugging (.NET 5005 convention)
#   - Lighter resource constraints
#   - Verbose logging
#   - Volume mounts for live code reload (hot reload)
#   - Swagger / OpenAPI enabled
#   - Automatic database migration on startup
#   - Sample data seeding enabled
#   - Seq log aggregator for structured logging
# =============================================================================

version: "3.9"

services:
  # ===========================================================================
  # Infrastructure - Dev Overrides
  # ===========================================================================

  sqlserver:
    environment:
      MSSQL_MEMORY_LIMIT_MB: 1024
    ports:
      - "1433:1433"

  redis:
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  # ===========================================================================
  # Seq Log Aggregator (Development Only)
  # ===========================================================================

  seq:
    image: datalust/seq:latest
    container_name: taketime-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    networks:
      - taketime-network

  # ===========================================================================
  # Database Migrator - Auto-run in dev
  # ===========================================================================

  migrator:
    profiles: []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TenantManagement: "Server=sqlserver;Database=TakeTime_TenantManagement;User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Migrator__SeedSampleData: "true"
      Migrator__DefaultAdminEmail: "admin@taketime.dev"
      Migrator__DefaultAdminPassword: "Admin@Dev123!"
    depends_on:
      sqlserver:
        condition: service_healthy

  # ===========================================================================
  # API Gateway - Dev
  # ===========================================================================

  api-gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      Logging__LogLevel__Default: "Debug"
      Logging__LogLevel__Microsoft.AspNetCore: "Information"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy

  # ===========================================================================
  # Reservation Service - Dev
  # ===========================================================================

  reservation-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5001"
      ConnectionStrings__ReservationDb: "Server=sqlserver;Database=TakeTime_Reservation_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5001:5001"
      - "15001:5005"

  # ===========================================================================
  # Payment Service - Dev
  # ===========================================================================

  payment-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5002"
      ConnectionStrings__PaymentDb: "Server=sqlserver;Database=TakeTime_Payment_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
      Payment__Stripe__SecretKey: "sk_test_placeholder"
      Payment__Stripe__WebhookSecret: "whsec_test_placeholder"
    ports:
      - "5002:5002"
      - "15002:5005"

  # ===========================================================================
  # Inventory Service - Dev
  # ===========================================================================

  inventory-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5003"
      ConnectionStrings__InventoryDb: "Server=sqlserver;Database=TakeTime_Inventory_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5003:5003"
      - "15003:5005"

  # ===========================================================================
  # HR Service - Dev
  # ===========================================================================

  hr-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5004"
      ConnectionStrings__HRDb: "Server=sqlserver;Database=TakeTime_HR_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5004:5004"
      - "15004:5005"

  # ===========================================================================
  # CRM Service - Dev
  # ===========================================================================

  crm-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5005"
      ConnectionStrings__CRMDb: "Server=sqlserver;Database=TakeTime_CRM_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5005:5005"
      - "15005:5005"

  # ===========================================================================
  # Channel Manager Service - Dev
  # ===========================================================================

  channel-manager-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5006"
      ConnectionStrings__ChannelManagerDb: "Server=sqlserver;Database=TakeTime_ChannelManager_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5006:5006"
      - "15006:5005"

  # ===========================================================================
  # Guest Experience Service - Dev
  # ===========================================================================

  guest-experience-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5007"
      ConnectionStrings__GuestExperienceDb: "Server=sqlserver;Database=TakeTime_GuestExperience_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5007:5007"
      - "15007:5005"

  # ===========================================================================
  # Accounting Service - Dev
  # ===========================================================================

  accounting-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5008"
      ConnectionStrings__AccountingDb: "Server=sqlserver;Database=TakeTime_Accounting_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5008:5008"
      - "15008:5005"

  # ===========================================================================
  # Notification Service - Dev
  # ===========================================================================

  notification-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5009"
      ConnectionStrings__NotificationDb: "Server=sqlserver;Database=TakeTime_Notification_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
      Notification__SMTP__Host: "mailhog"
      Notification__SMTP__Port: "1025"
    ports:
      - "5009:5009"
      - "15009:5005"

  # ===========================================================================
  # Affiliate Service - Dev
  # ===========================================================================

  affiliate-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5010"
      ConnectionStrings__AffiliateDb: "Server=sqlserver;Database=TakeTime_Affiliate_{TenantId};User Id=sa;Password=TakeTime_Dev!Pass;TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Logging__LogLevel__Default: "Debug"
      Seq__ServerUrl: "http://seq:5341"
      Swagger__Enabled: "true"
    ports:
      - "5010:5010"
      - "15010:5005"

  # ===========================================================================
  # MailHog - Dev Email Catcher
  # ===========================================================================

  mailhog:
    image: mailhog/mailhog:latest
    container_name: taketime-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - taketime-network

volumes:
  seq-data:
    driver: local
    name: taketime-seq-data
