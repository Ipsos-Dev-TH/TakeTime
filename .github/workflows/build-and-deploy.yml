name: Build and Deploy to IIS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  SOLUTION_FILE: 'Take Time BangPhra.sln'
  PROJECT_FILE: 'Take Time BangPhra/Take Time BangPhra.csproj'
  BUILD_CONFIGURATION: 'Release'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          Write-Host "=== Environment Check ==="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Workspace: ${{ github.workspace }}"
          Write-Host ""

          # Check required variables
          $sitePath = "${{ vars.IIS_SITE_PATH }}"
          $backupPath = "${{ vars.BACKUP_PATH }}"

          if ([string]::IsNullOrEmpty($sitePath)) {
            Write-Host "::error::vars.IIS_SITE_PATH is not configured! Go to repo Settings > Secrets and variables > Actions > Variables"
            exit 1
          }
          if ([string]::IsNullOrEmpty($backupPath)) {
            Write-Host "::error::vars.BACKUP_PATH is not configured! Go to repo Settings > Secrets and variables > Actions > Variables"
            exit 1
          }

          Write-Host "IIS_SITE_PATH: $sitePath"
          Write-Host "BACKUP_PATH: $backupPath"
          Write-Host "SITE_URL: ${{ vars.SITE_URL }}"

          # Check if site path exists
          if (Test-Path $sitePath) {
            Write-Host "Site path exists: OK"
          } else {
            Write-Host "::warning::Site path does not exist yet: $sitePath"
          }

          Write-Host "=== Environment Check Complete ==="
        shell: powershell

      - name: Find MSBuild
        run: |
          # Try vswhere first (most reliable on self-hosted)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $msbuildPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
            if ($msbuildPath) {
              Write-Host "Found MSBuild via vswhere: $msbuildPath"
              $msbuildDir = Split-Path $msbuildPath -Parent
              echo "$msbuildDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              exit 0
            }
          }

          # Fallback: check if msbuild is already in PATH
          $existing = Get-Command msbuild -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "MSBuild already in PATH: $($existing.Source)"
            exit 0
          }

          Write-Host "::error::MSBuild not found! Please install Visual Studio or Build Tools on this runner."
          exit 1
        shell: powershell

      - name: Find NuGet
        run: |
          # Check if nuget is already available
          $existing = Get-Command nuget -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "NuGet found: $($existing.Source)"
            exit 0
          }

          # Download nuget.exe if not found
          $nugetPath = "${{ github.workspace }}\nuget.exe"
          Write-Host "NuGet not found in PATH, downloading..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nugetPath -UseBasicParsing
          Write-Host "Downloaded NuGet to: $nugetPath"
          echo "${{ github.workspace }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Restore NuGet packages
        run: |
          nuget restore "${{ env.SOLUTION_FILE }}"
        shell: powershell

      - name: Build Project
        run: |
          msbuild "${{ env.PROJECT_FILE }}" /p:Configuration=${{ env.BUILD_CONFIGURATION }} /verbosity:minimal
        shell: powershell

      - name: Backup current site
        run: |
          $sitePath = "${{ vars.IIS_SITE_PATH }}"
          $backupRoot = "${{ vars.BACKUP_PATH }}"
          $backupPath = "$backupRoot\backup_$(Get-Date -Format 'yyyyMMdd_HHmmss')"

          if ([string]::IsNullOrEmpty($sitePath) -or [string]::IsNullOrEmpty($backupRoot)) {
            Write-Host "::warning::Backup skipped - IIS_SITE_PATH or BACKUP_PATH not configured"
            exit 0
          }

          if (Test-Path $sitePath) {
            New-Item -ItemType Directory -Path $backupPath -Force | Out-Null
            Copy-Item -Path "$sitePath\*" -Destination $backupPath -Recurse -Force
            Write-Host "Backup created: $backupPath"
          } else {
            Write-Host "::warning::Site path not found, skipping backup: $sitePath"
          }
        shell: powershell

      - name: Deploy to IIS
        run: |
          $projectPath = "${{ github.workspace }}\Take Time BangPhra"
          $sitePath = "${{ vars.IIS_SITE_PATH }}"

          if ([string]::IsNullOrEmpty($sitePath)) {
            Write-Host "::error::vars.IIS_SITE_PATH is not configured!"
            exit 1
          }

          Write-Host "Deploying from: $projectPath"
          Write-Host "Deploying to: $sitePath"

          if (!(Test-Path $projectPath)) {
            Write-Host "::error::Project path not found: $projectPath"
            exit 1
          }

          # Ensure site path exists
          if (!(Test-Path $sitePath)) {
            New-Item -ItemType Directory -Path $sitePath -Force | Out-Null
            Write-Host "Created site directory: $sitePath"
          }

          # Get all files to deploy (exclude source code, project files, obj folder)
          $fileCount = 0
          Get-ChildItem -Path $projectPath -Recurse |
            Where-Object {
              $item = $_
              $exclude = $false

              # Exclude folders
              if ($item.FullName -match "\\obj\\") { $exclude = $true }
              if ($item.FullName -match "\\Properties\\") { $exclude = $true }
              if ($item.FullName -match "\\.vs\\") { $exclude = $true }

              # Exclude files
              if ($item.Extension -eq ".cs" -and $item.FullName -notmatch "\\bin\\") { $exclude = $true }
              if ($item.Extension -eq ".csproj") { $exclude = $true }
              if ($item.Name -eq "packages.config") { $exclude = $true }
              if ($item.Name -eq "Web.config") { $exclude = $true }

              -not $exclude
            } |
            ForEach-Object {
              $relativePath = $_.FullName.Substring($projectPath.Length)
              $destPath = Join-Path $sitePath $relativePath

              if ($_.PSIsContainer) {
                if (!(Test-Path $destPath)) {
                  New-Item -ItemType Directory -Path $destPath -Force | Out-Null
                }
              } else {
                $destDir = Split-Path -Parent $destPath
                if (!(Test-Path $destDir)) {
                  New-Item -ItemType Directory -Path $destDir -Force | Out-Null
                }
                Copy-Item -Path $_.FullName -Destination $destPath -Force
                $fileCount++
              }
            }

          Write-Host "Deployment complete: $fileCount files copied (Web.config preserved)"
        shell: powershell

      - name: Health Check
        run: |
          $siteUrl = "${{ vars.SITE_URL }}"
          if ([string]::IsNullOrEmpty($siteUrl)) {
            Write-Host "SITE_URL not configured, skipping health check"
            exit 0
          }

          try {
            $response = Invoke-WebRequest -Uri $siteUrl -UseBasicParsing -TimeoutSec 30
            Write-Host "Health check passed! Status: $($response.StatusCode)"
          } catch {
            Write-Host "::warning::Health check failed: $($_.Exception.Message)"
          }
        shell: powershell

      - name: Deployment Summary
        if: always()
        run: |
          Write-Host "================================"
          Write-Host "Deployment Complete!"
          Write-Host "Site: ${{ vars.IIS_SITE_PATH }}"
          Write-Host "URL: ${{ vars.SITE_URL }}"
          Write-Host "Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "================================"
        shell: powershell
