<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeTime Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-gray-50 font-thai" x-data="adminApp()" x-init="init()">

    <!-- Mobile sidebar overlay -->
    <div x-show="sidebarOpen" x-transition:enter="transition-opacity ease-linear duration-300"
        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        x-transition:leave="transition-opacity ease-linear duration-300"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-gray-900/50 z-40 lg:hidden" @click="sidebarOpen = false"></div>

    <!-- Sidebar -->
    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
        class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white z-50 transform transition-transform duration-200 lg:translate-x-0 flex flex-col">

        <!-- Logo -->
        <div class="flex items-center gap-3 px-5 py-4 border-b border-gray-700">
            <div class="w-9 h-9 bg-indigo-500 rounded-xl flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold">TakeTime</h1>
                <p class="text-xs text-gray-400">Admin Portal</p>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <button @click="navigate('dashboard')" :class="currentPage === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                แดชบอร์ด
            </button>

            <div class="pt-4 pb-2 px-3"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">การจัดการหลัก</p></div>

            <button @click="navigate('reservations')" :class="currentPage === 'reservations' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                การจองห้องพัก
            </button>

            <button @click="navigate('rooms')" :class="currentPage === 'rooms' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                ห้องพัก & ราคา
            </button>

            <button @click="navigate('payments')" :class="currentPage === 'payments' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                การเงิน & ชำระเงิน
            </button>

            <button @click="navigate('inventory')" :class="currentPage === 'inventory' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                สินค้า & POS
            </button>

            <div class="pt-4 pb-2 px-3"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">บริการแขก</p></div>

            <button @click="navigate('housekeeping')" :class="currentPage === 'housekeeping' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
                แม่บ้าน
            </button>

            <button @click="navigate('roomservice')" :class="currentPage === 'roomservice' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                รูมเซอร์วิส
            </button>

            <button @click="navigate('maintenance')" :class="currentPage === 'maintenance' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                ซ่อมบำรุง
            </button>

            <div class="pt-4 pb-2 px-3"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">CRM & การตลาด</p></div>

            <button @click="navigate('customers')" :class="currentPage === 'customers' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                ลูกค้า & สมาชิก
            </button>

            <button @click="navigate('channels')" :class="currentPage === 'channels' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
                ช่องทางขาย (OTA)
            </button>

            <button @click="navigate('affiliates')" :class="currentPage === 'affiliates' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                พันธมิตร
            </button>

            <div class="pt-4 pb-2 px-3"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">HR & บัญชี</p></div>

            <button @click="navigate('hr')" :class="currentPage === 'hr' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                บุคลากร
            </button>

            <button @click="navigate('accounting')" :class="currentPage === 'accounting' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                บัญชี & รายงาน
            </button>

            <div class="pt-4 pb-2 px-3"><p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">ตั้งค่าระบบ</p></div>

            <button @click="navigate('notifications')" :class="currentPage === 'notifications' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                การแจ้งเตือน
            </button>

            <button @click="navigate('users')" :class="currentPage === 'users' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                ผู้ใช้ & สิทธิ์
            </button>

            <button @click="navigate('tenants')" :class="currentPage === 'tenants' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                Tenant & ตั้งค่า
            </button>

            <button @click="navigate('features')" :class="currentPage === 'features' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-800'" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                เปิด/ปิด ฟีเจอร์
            </button>
        </nav>

        <!-- User section at bottom -->
        <div class="border-t border-gray-700 p-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center text-sm font-medium" x-text="(user?.name || 'A')[0].toUpperCase()"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate" x-text="user?.name || 'Admin'"></p>
                    <p class="text-xs text-gray-400 truncate" x-text="tenantId"></p>
                </div>
                <button @click="logout()" class="text-gray-400 hover:text-white" title="ออกจากระบบ">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <div class="lg:ml-64">
        <!-- Top bar -->
        <header class="bg-white border-b border-gray-200 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h2 class="text-lg font-semibold text-gray-800" x-text="pageTitle"></h2>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">Demo Mode</span>
                <span class="text-sm text-gray-500" x-text="currentTime"></span>
            </div>
        </header>

        <!-- Page content -->
        <main class="p-4 lg:p-6" id="page-content"></main>
    </div>

    <!-- Scripts (relative paths) -->
    <script src="js/api.js"></script>
    <script src="js/components/table.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/stats.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/reservations.js"></script>
    <script src="js/pages/rooms.js"></script>
    <script src="js/pages/payments.js"></script>
    <script src="js/pages/inventory.js"></script>
    <script src="js/pages/housekeeping.js"></script>
    <script src="js/pages/roomservice.js"></script>
    <script src="js/pages/maintenance.js"></script>
    <script src="js/pages/customers.js"></script>
    <script src="js/pages/channels.js"></script>
    <script src="js/pages/affiliates.js"></script>
    <script src="js/pages/hr.js"></script>
    <script src="js/pages/accounting.js"></script>
    <script src="js/pages/notifications.js"></script>
    <script src="js/pages/users.js"></script>
    <script src="js/pages/tenants.js"></script>
    <script src="js/pages/features.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
