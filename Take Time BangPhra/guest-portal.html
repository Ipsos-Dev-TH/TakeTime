<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeTime - Guest Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; }
        .service-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .service-card { transition: all 0.2s ease; cursor: pointer; }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div x-data="guestPortal()" x-init="init()">

    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold text-gray-800">TakeTime BangPhra</h1>
                <p class="text-sm text-gray-500" x-text="'ห้อง ' + guest.room + ' | ' + guest.name"></p>
            </div>
            <div class="flex items-center space-x-3">
                <button @click="currentPage = 'chat'" class="relative p-2 text-gray-500 hover:text-indigo-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center" x-show="unreadMessages > 0" x-text="unreadMessages"></span>
                </button>
                <select x-model="lang" class="text-sm border rounded-lg px-2 py-1">
                    <option value="th">TH</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Login Screen -->
    <template x-if="!isLoggedIn">
        <div class="max-w-sm mx-auto px-4 py-20 text-center fade-in">
            <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Guest Portal</h2>
            <p class="text-gray-500 mb-8">กรุณากรอกหมายเลขห้องและรหัสการจอง</p>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">หมายเลขห้อง</label>
                    <input type="text" x-model="loginRoom" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-center text-2xl font-mono tracking-widest focus:ring-2 focus:ring-indigo-500" placeholder="101">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">รหัสการจอง</label>
                    <input type="text" x-model="loginCode" class="w-full border border-gray-300 rounded-lg px-4 py-3 text-center text-lg font-mono uppercase tracking-widest focus:ring-2 focus:ring-indigo-500" placeholder="TT-XXXXXX">
                </div>
                <button @click="guestLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition mt-2">เข้าสู่ระบบ</button>
            </div>
        </div>
    </template>

    <!-- Main Content -->
    <template x-if="isLoggedIn">
        <div class="max-w-lg mx-auto px-4 py-6">

            <!-- Home Page -->
            <template x-if="currentPage === 'home'">
                <div class="fade-in space-y-6">
                    <!-- Welcome Banner -->
                    <div class="bg-gradient-to-r from-indigo-600 to-blue-500 rounded-2xl p-5 text-white">
                        <h2 class="text-xl font-bold mb-1" x-text="'สวัสดีค่ะ คุณ' + guest.name"></h2>
                        <p class="text-blue-100 text-sm">ห้อง <span x-text="guest.room"></span> | เช็คเอาท์ <span x-text="guest.checkOut"></span></p>
                    </div>

                    <!-- Quick Actions -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">บริการด่วน</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div @click="currentPage = 'housekeeping'" class="service-card bg-white rounded-xl p-4 text-center shadow-sm">
                                <div class="text-3xl mb-2">🧹</div>
                                <p class="font-medium text-gray-800 text-sm">แม่บ้าน</p>
                                <p class="text-xs text-gray-400">ทำความสะอาด</p>
                            </div>
                            <div @click="currentPage = 'roomservice'" class="service-card bg-white rounded-xl p-4 text-center shadow-sm">
                                <div class="text-3xl mb-2">🍽️</div>
                                <p class="font-medium text-gray-800 text-sm">Room Service</p>
                                <p class="text-xs text-gray-400">สั่งอาหาร</p>
                            </div>
                            <div @click="currentPage = 'maintenance'" class="service-card bg-white rounded-xl p-4 text-center shadow-sm">
                                <div class="text-3xl mb-2">🔧</div>
                                <p class="font-medium text-gray-800 text-sm">แจ้งซ่อม</p>
                                <p class="text-xs text-gray-400">รายงานปัญหา</p>
                            </div>
                            <div @click="currentPage = 'chat'" class="service-card bg-white rounded-xl p-4 text-center shadow-sm">
                                <div class="text-3xl mb-2">💬</div>
                                <p class="font-medium text-gray-800 text-sm">แชท</p>
                                <p class="text-xs text-gray-400">ติดต่อพนักงาน</p>
                            </div>
                        </div>
                    </div>

                    <!-- Info Sections -->
                    <div>
                        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">ข้อมูลที่พัก</h3>
                        <div class="space-y-2">
                            <div @click="currentPage = 'facilities'" class="service-card bg-white rounded-xl p-4 flex items-center shadow-sm">
                                <div class="text-2xl mr-4">🏊</div>
                                <div class="flex-1"><p class="font-medium text-gray-800">สิ่งอำนวยความสะดวก</p><p class="text-xs text-gray-400">สระว่ายน้ำ, WiFi, ที่จอดรถ ฯลฯ</p></div>
                                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </div>
                            <div @click="currentPage = 'nearby'" class="service-card bg-white rounded-xl p-4 flex items-center shadow-sm">
                                <div class="text-2xl mr-4">📍</div>
                                <div class="flex-1"><p class="font-medium text-gray-800">สถานที่ใกล้เคียง</p><p class="text-xs text-gray-400">ร้านอาหาร, ชายหาด, ตลาด</p></div>
                                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </div>
                            <div @click="currentPage = 'emergency'" class="service-card bg-white rounded-xl p-4 flex items-center shadow-sm">
                                <div class="text-2xl mr-4">🆘</div>
                                <div class="flex-1"><p class="font-medium text-gray-800">เบอร์ฉุกเฉิน</p><p class="text-xs text-gray-400">ส่วนหน้า, ตำรวจ, โรงพยาบาล</p></div>
                                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </div>
                            <div @click="currentPage = 'review'" class="service-card bg-white rounded-xl p-4 flex items-center shadow-sm">
                                <div class="text-2xl mr-4">⭐</div>
                                <div class="flex-1"><p class="font-medium text-gray-800">รีวิว & ให้คะแนน</p><p class="text-xs text-gray-400">แบ่งปันประสบการณ์ของคุณ</p></div>
                                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Housekeeping Request Page -->
            <template x-if="currentPage === 'housekeeping'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">🧹 ขอบริการแม่บ้าน</h2>
                    <div class="space-y-3">
                        <template x-for="task in housekeepingOptions" :key="task.id">
                            <button @click="requestHousekeeping(task)" class="w-full bg-white rounded-xl p-4 text-left shadow-sm hover:shadow-md transition flex items-center">
                                <span class="text-2xl mr-3" x-text="task.icon"></span>
                                <div><p class="font-medium text-gray-800" x-text="task.name"></p><p class="text-xs text-gray-400" x-text="task.desc"></p></div>
                            </button>
                        </template>
                    </div>
                    <template x-if="requestSent">
                        <div class="mt-4 bg-green-50 border border-green-200 rounded-xl p-4 text-center fade-in">
                            <p class="text-green-700 font-medium">ส่งคำขอเรียบร้อยแล้ว!</p>
                            <p class="text-sm text-green-600 mt-1">พนักงานจะมาถึงภายใน 15-30 นาที</p>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Room Service Page -->
            <template x-if="currentPage === 'roomservice'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">🍽️ Room Service</h2>
                    <div class="space-y-3">
                        <template x-for="cat in menuCategories" :key="cat.name">
                            <div>
                                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2" x-text="cat.name"></h3>
                                <template x-for="item in cat.items" :key="item.id">
                                    <div class="bg-white rounded-xl p-4 shadow-sm mb-2 flex items-center justify-between">
                                        <div>
                                            <p class="font-medium text-gray-800" x-text="item.name"></p>
                                            <p class="text-sm text-indigo-600 font-semibold" x-text="'฿' + item.price"></p>
                                        </div>
                                        <div class="flex items-center space-x-2">
                                            <button @click="item.qty = Math.max(0, (item.qty || 0) - 1)" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-200">-</button>
                                            <span class="w-6 text-center font-medium" x-text="item.qty || 0"></span>
                                            <button @click="item.qty = (item.qty || 0) + 1" class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 hover:bg-indigo-200">+</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="sticky bottom-4 mt-6" x-show="cartTotal > 0">
                        <button @click="submitRoomService()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                            <span>สั่งเลย</span>
                            <span class="bg-white/20 px-3 py-0.5 rounded-full text-sm" x-text="'฿' + cartTotal.toLocaleString()"></span>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Maintenance Report Page -->
            <template x-if="currentPage === 'maintenance'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">🔧 แจ้งซ่อม / รายงานปัญหา</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ประเภทปัญหา</label>
                            <select x-model="maintenance.type" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-indigo-500">
                                <option value="">เลือกประเภท</option>
                                <option value="plumbing">ประปา / น้ำรั่ว</option>
                                <option value="electrical">ไฟฟ้า / หลอดไฟ</option>
                                <option value="aircon">แอร์ / เครื่องปรับอากาศ</option>
                                <option value="furniture">เฟอร์นิเจอร์</option>
                                <option value="internet">อินเทอร์เน็ต / WiFi</option>
                                <option value="other">อื่นๆ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียด</label>
                            <textarea x-model="maintenance.description" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500" placeholder="อธิบายปัญหาที่พบ..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ความเร่งด่วน</label>
                            <div class="flex space-x-3">
                                <button @click="maintenance.priority = 'low'" :class="maintenance.priority === 'low' ? 'bg-green-100 border-green-500 text-green-700' : 'bg-white border-gray-300 text-gray-600'" class="flex-1 border-2 rounded-lg py-2 text-sm font-medium transition">ปกติ</button>
                                <button @click="maintenance.priority = 'medium'" :class="maintenance.priority === 'medium' ? 'bg-yellow-100 border-yellow-500 text-yellow-700' : 'bg-white border-gray-300 text-gray-600'" class="flex-1 border-2 rounded-lg py-2 text-sm font-medium transition">ด่วน</button>
                                <button @click="maintenance.priority = 'high'" :class="maintenance.priority === 'high' ? 'bg-red-100 border-red-500 text-red-700' : 'bg-white border-gray-300 text-gray-600'" class="flex-1 border-2 rounded-lg py-2 text-sm font-medium transition">ด่วนมาก</button>
                            </div>
                        </div>
                        <button @click="submitMaintenance()" :disabled="!maintenance.type || !maintenance.description" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">ส่งแจ้งซ่อม</button>
                    </div>
                </div>
            </template>

            <!-- Chat Page -->
            <template x-if="currentPage === 'chat'">
                <div class="fade-in flex flex-col" style="height: calc(100vh - 120px);">
                    <div class="flex items-center justify-between mb-4">
                        <button @click="currentPage = 'home'" class="flex items-center text-indigo-600"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                        <h2 class="text-lg font-bold text-gray-800">💬 แชทกับพนักงาน</h2>
                        <div class="w-16"></div>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-3 mb-4" id="chatMessages">
                        <template x-for="(msg, i) in chatMessages" :key="i">
                            <div :class="msg.isGuest ? 'flex justify-end' : 'flex justify-start'">
                                <div :class="msg.isGuest ? 'bg-indigo-600 text-white' : 'bg-white text-gray-800 shadow-sm'" class="rounded-2xl px-4 py-2.5 max-w-[80%]">
                                    <p class="text-sm" x-text="msg.text"></p>
                                    <p :class="msg.isGuest ? 'text-indigo-200' : 'text-gray-400'" class="text-xs mt-1" x-text="msg.time"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="flex space-x-2">
                        <input type="text" x-model="chatInput" @keydown.enter="sendChat()" class="flex-1 border border-gray-300 rounded-full px-4 py-2.5 focus:ring-2 focus:ring-indigo-500" placeholder="พิมพ์ข้อความ...">
                        <button @click="sendChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-11 h-11 rounded-full flex items-center justify-center transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Facilities Page -->
            <template x-if="currentPage === 'facilities'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">🏊 สิ่งอำนวยความสะดวก</h2>
                    <div class="space-y-3">
                        <template x-for="f in facilityDetails" :key="f.name">
                            <div class="bg-white rounded-xl p-4 shadow-sm">
                                <div class="flex items-center mb-2">
                                    <span class="text-2xl mr-3" x-text="f.icon"></span>
                                    <div><p class="font-medium text-gray-800" x-text="f.name"></p><p class="text-xs text-indigo-600" x-text="f.hours"></p></div>
                                </div>
                                <p class="text-sm text-gray-500" x-text="f.desc"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Nearby Places Page -->
            <template x-if="currentPage === 'nearby'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">📍 สถานที่ใกล้เคียง</h2>
                    <div class="space-y-3">
                        <template x-for="place in nearbyPlaces" :key="place.name">
                            <div class="bg-white rounded-xl p-4 shadow-sm flex items-center">
                                <span class="text-2xl mr-3" x-text="place.icon"></span>
                                <div class="flex-1"><p class="font-medium text-gray-800" x-text="place.name"></p><p class="text-xs text-gray-400" x-text="place.distance"></p></div>
                                <a :href="place.mapUrl" target="_blank" class="text-indigo-600 text-sm font-medium">แผนที่</a>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Emergency Page -->
            <template x-if="currentPage === 'emergency'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">🆘 เบอร์ฉุกเฉิน</h2>
                    <div class="space-y-3">
                        <template x-for="contact in emergencyContacts" :key="contact.name">
                            <a :href="'tel:' + contact.phone" class="block bg-white rounded-xl p-4 shadow-sm flex items-center hover:shadow-md transition">
                                <span class="text-2xl mr-3" x-text="contact.icon"></span>
                                <div class="flex-1"><p class="font-medium text-gray-800" x-text="contact.name"></p><p class="text-sm text-gray-500" x-text="contact.phone"></p></div>
                                <div class="bg-green-100 text-green-600 px-3 py-1 rounded-full text-sm font-medium">โทร</div>
                            </a>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Review Page -->
            <template x-if="currentPage === 'review'">
                <div class="fade-in">
                    <button @click="currentPage = 'home'" class="flex items-center text-indigo-600 mb-4"><svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> กลับ</button>
                    <h2 class="text-xl font-bold text-gray-800 mb-4">⭐ ให้คะแนนและรีวิว</h2>
                    <div class="space-y-4">
                        <div class="text-center">
                            <p class="text-sm text-gray-500 mb-2">คะแนนรวม</p>
                            <div class="flex justify-center space-x-2">
                                <template x-for="star in [1,2,3,4,5]" :key="star">
                                    <button @click="review.rating = star" class="text-3xl transition" :class="star <= review.rating ? 'text-yellow-400' : 'text-gray-300'">&#9733;</button>
                                </template>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ความคิดเห็น</label>

        get cartTotal() {
            let total = 0;
            this.menuCategories.forEach(cat => {
                cat.items.forEach(item => { total += (item.qty || 0) * item.price; });
            });
            return total;
        },

        init() {},

        guestLogin() {
            // In production, verify with API: GET /api/v1/portal/reservations/{code}
            if (this.loginRoom && this.loginCode) {
                this.isLoggedIn = true;
                this.guest = { name: 'Guest', room: this.loginRoom, checkOut: '17 มี.ค. 2025' };
            }
        },

        requestHousekeeping(task) {
            // In production: POST /api/v1/guest-portal/housekeeping
            this.requestSent = true;
            setTimeout(() => { this.requestSent = false; }, 5000);
        },

        submitRoomService() {
            // In production: POST /api/v1/guest-portal/room-service
            alert('สั่ง Room Service สำเร็จ! ยอดรวม ฿' + this.cartTotal.toLocaleString() + '\nอาหารจะถูกจัดส่งภายใน 30-45 นาที');
            this.menuCategories.forEach(cat => { cat.items.forEach(item => { item.qty = 0; }); });
        },

        submitMaintenance() {
            // In production: POST /api/v1/guest-portal/maintenance
            alert('ส่งแจ้งซ่อมเรียบร้อย! ช่างจะเข้ามาตรวจสอบเร็วที่สุด');
            this.maintenance = { type: '', description: '', priority: 'low' };
            this.currentPage = 'home';
        },

        sendChat() {
            if (!this.chatInput.trim()) return;
            const now = new Date();
            this.chatMessages.push({ text: this.chatInput, isGuest: true, time: now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') });
            this.chatInput = '';
            // In production: POST /api/v1/chat/messages
            setTimeout(() => {
                this.chatMessages.push({ text: 'ขอบคุณที่ติดต่อมาค่ะ เจ้าหน้าที่กำลังดูแลให้ค่ะ', isGuest: false, time: now.getHours() + ':' + String(now.getMinutes() + 1).padStart(2, '0') });
            }, 2000);
        },

        submitReview() {
            // In production: POST /api/v1/guest-portal/reviews
            alert('ขอบคุณสำหรับรีวิวค่ะ! ⭐'.repeat(this.review.rating));
            this.review = { rating: 0, comment: '' };
            this.currentPage = 'home';

</script>
