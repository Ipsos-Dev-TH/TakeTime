<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeTime - เข้าสู่ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div x-data="loginForm()" class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">TakeTime</h1>
            <p class="text-gray-500 mt-1">ระบบบริหารจัดการที่พัก</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-6">เข้าสู่ระบบผู้ดูแล</h2>

            <!-- Tenant Selection -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-600 mb-1">Tenant</label>
                <select x-model="tenantId" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                    <option value="taketime-bangphra">TakeTime BangPhra</option>
                    <option value="demo">Demo Tenant</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อผู้ใช้</label>
                <input type="text" x-model="username" @keyup.enter="login"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="admin">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-600 mb-1">รหัสผ่าน</label>
                <div class="relative">
                    <input :type="showPassword ? 'text' : 'password'" x-model="password" @keyup.enter="login"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="********">
                    <button @click="showPassword = !showPassword" type="button"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <svg x-show="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                        <svg x-show="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div x-show="error" x-transition class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-600" x-text="error"></p>
            </div>

            <button @click="login" :disabled="loading"
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
                <svg x-show="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ'"></span>
            </button>
        </div>

        <p class="text-center text-sm text-gray-400 mt-6">TakeTime Admin Portal v1.0</p>
    </div>

    <script>
    function loginForm() {
        return {
            tenantId: 'taketime-bangphra',
            username: '',
            password: '',
            showPassword: false,
            loading: false,
            error: '',

            async login() {
                if (!this.username || !this.password) {
                    this.error = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
                    return;
                }

                this.loading = true;
                this.error = '';

                try {
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Tenant-Id': this.tenantId
                        },
                        body: JSON.stringify({
                            username: this.username,
                            password: this.password
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('refreshToken', data.refreshToken);
                        localStorage.setItem('tenantId', this.tenantId);
                        localStorage.setItem('user', JSON.stringify(data.user || { username: this.username }));
                        window.location.href = '/admin.html';
                    } else if (response.status === 501) {
                        // API not implemented yet - demo mode
                        localStorage.setItem('token', 'demo-token');
                        localStorage.setItem('tenantId', this.tenantId);
                        localStorage.setItem('user', JSON.stringify({
                            username: this.username,
                            role: 'Admin',
                            name: this.username
                        }));
                        window.location.href = '/admin.html';
                    } else {
                        const err = await response.json().catch(() => null);
                        this.error = err?.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                    }
                } catch (e) {
                    // If API unreachable, allow demo mode
                    localStorage.setItem('token', 'demo-token');
                    localStorage.setItem('tenantId', this.tenantId);
                    localStorage.setItem('user', JSON.stringify({
                        username: this.username,
                        role: 'Admin',
                        name: this.username
                    }));
                    window.location.href = '/admin.html';
                } finally {
                    this.loading = false;
                }
            }
        };
    }
    </script>
</body>
</html>
