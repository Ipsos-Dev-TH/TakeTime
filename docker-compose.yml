# =============================================================================
# TakeTime Platform - Docker Compose (Production)
# =============================================================================
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose up -d --build            # Rebuild and start
#   docker compose --profile migrator up    # Run database migrations
#   docker compose logs -f reservation-api  # Follow logs for a service
# =============================================================================

version: "3.9"

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_RUNNING_IN_CONTAINER: "true"
  TZ: Asia/Bangkok
  JWT__Secret: "${JWT_SECRET:-TakeTime-Super-Secret-Key-That-Should-Be-Changed-In-Production-Min-32-Chars!}"
  JWT__Issuer: "${JWT_ISSUER:-taketime-platform}"
  JWT__Audience: "${JWT_AUDIENCE:-taketime-clients}"
  JWT__ExpirationMinutes: "${JWT_EXPIRATION_MINUTES:-60}"
  ConnectionStrings__TenantManagement: "Server=sqlserver;Database=TakeTime_TenantManagement;User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "${RABBITMQ_USER:-taketime}"
  RabbitMQ__Password: "${RABBITMQ_PASS:-TakeTime_Rabbit!}"
  RabbitMQ__VirtualHost: "/"
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-TakeTime_Redis!},abortConnect=false,connectTimeout=5000"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
  Logging__LogLevel__System: "Warning"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - taketime-network
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taketime-sqlserver
    <<: *service-defaults
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-TakeTime_Str0ng!Pass}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: 2048
      TZ: Asia/Bangkok
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -b -o /dev/null
      <<: *healthcheck-defaults
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: taketime-redis
    <<: *service-defaults
    command: redis-server --requirepass "${REDIS_PASSWORD:-TakeTime_Redis!}" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-TakeTime_Redis!}", "ping"]
      <<: *healthcheck-defaults
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taketime-rabbitmq
    <<: *service-defaults
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-taketime}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-TakeTime_Rabbit!}"
      RABBITMQ_DEFAULT_VHOST: "/"
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.6
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      <<: *healthcheck-defaults
      start_period: 30s

  # ===========================================================================
  # Database Migrator (run on-demand with --profile migrator)
  # ===========================================================================

  migrator:
    build:
      context: .
      dockerfile: src/Migrator/TakeTime.Migrator/Dockerfile
    container_name: taketime-migrator
    profiles: ["migrator"]
    environment:
      <<: *common-env
      ConnectionStrings__TenantManagement: "Server=sqlserver;Database=TakeTime_TenantManagement;User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Migrator__SeedSampleData: "${SEED_SAMPLE_DATA:-false}"
      Migrator__DefaultAdminEmail: "${DEFAULT_ADMIN_EMAIL:-admin@taketime.app}"
      Migrator__DefaultAdminPassword: "${DEFAULT_ADMIN_PASSWORD:-Admin@TakeTime123!}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - taketime-network

  # ===========================================================================
  # API Gateway
  # ===========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/TakeTime.ApiGateway/Dockerfile
    container_name: taketime-api-gateway
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5000"
      ReverseProxy__Clusters__reservation__Destinations__default__Address: "http://reservation-api:5001"
      ReverseProxy__Clusters__payment__Destinations__default__Address: "http://payment-api:5002"
      ReverseProxy__Clusters__inventory__Destinations__default__Address: "http://inventory-api:5003"
      ReverseProxy__Clusters__hr__Destinations__default__Address: "http://hr-api:5004"
      ReverseProxy__Clusters__crm__Destinations__default__Address: "http://crm-api:5005"
      ReverseProxy__Clusters__channel-manager__Destinations__default__Address: "http://channel-manager-api:5006"
      ReverseProxy__Clusters__guest-experience__Destinations__default__Address: "http://guest-experience-api:5007"
      ReverseProxy__Clusters__accounting__Destinations__default__Address: "http://accounting-api:5008"
      ReverseProxy__Clusters__notification__Destinations__default__Address: "http://notification-api:5009"
      ReverseProxy__Clusters__affiliate__Destinations__default__Address: "http://affiliate-api:5010"
      RateLimiting__PermitLimit: 100
      RateLimiting__WindowSeconds: 60
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Reservation Service
  # ===========================================================================

  reservation-api:
    build:
      context: .
      dockerfile: src/Services/Reservation/TakeTime.Reservation.API/Dockerfile
    container_name: taketime-reservation-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5001"
      ConnectionStrings__ReservationDb: "Server=sqlserver;Database=TakeTime_Reservation_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "reservation-api"
      Service__Port: "5001"
    ports:
      - "${RESERVATION_PORT:-5001}:5001"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Payment Service
  # ===========================================================================

  payment-api:
    build:
      context: .
      dockerfile: src/Services/Payment/TakeTime.Payment.API/Dockerfile
    container_name: taketime-payment-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5002"
      ConnectionStrings__PaymentDb: "Server=sqlserver;Database=TakeTime_Payment_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "payment-api"
      Service__Port: "5002"
      Payment__PromptPay__Enabled: "${PROMPTPAY_ENABLED:-true}"
      Payment__Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Payment__Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
    ports:
      - "${PAYMENT_PORT:-5002}:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Inventory Service
  # ===========================================================================

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/TakeTime.Inventory.API/Dockerfile
    container_name: taketime-inventory-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5003"
      ConnectionStrings__InventoryDb: "Server=sqlserver;Database=TakeTime_Inventory_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "inventory-api"
      Service__Port: "5003"
    ports:
      - "${INVENTORY_PORT:-5003}:5003"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Human Resources Service
  # ===========================================================================

  hr-api:
    build:
      context: .
      dockerfile: src/Services/HumanResources/TakeTime.HumanResources.API/Dockerfile
    container_name: taketime-hr-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5004"
      ConnectionStrings__HRDb: "Server=sqlserver;Database=TakeTime_HR_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "hr-api"
      Service__Port: "5004"
    ports:
      - "${HR_PORT:-5004}:5004"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # CRM Service
  # ===========================================================================

  crm-api:
    build:
      context: .
      dockerfile: src/Services/CRM/TakeTime.CRM.API/Dockerfile
    container_name: taketime-crm-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5005"
      ConnectionStrings__CRMDb: "Server=sqlserver;Database=TakeTime_CRM_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "crm-api"
      Service__Port: "5005"
    ports:
      - "${CRM_PORT:-5005}:5005"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Channel Manager Service
  # ===========================================================================

  channel-manager-api:
    build:
      context: .
      dockerfile: src/Services/ChannelManager/TakeTime.ChannelManager.API/Dockerfile
    container_name: taketime-channel-manager-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5006"
      ConnectionStrings__ChannelManagerDb: "Server=sqlserver;Database=TakeTime_ChannelManager_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "channel-manager-api"
      Service__Port: "5006"
      ChannelManager__BookingCom__Enabled: "${BOOKINGCOM_ENABLED:-false}"
      ChannelManager__Agoda__Enabled: "${AGODA_ENABLED:-false}"
      ChannelManager__Expedia__Enabled: "${EXPEDIA_ENABLED:-false}"
    ports:
      - "${CHANNEL_MANAGER_PORT:-5006}:5006"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Guest Experience Service
  # ===========================================================================

  guest-experience-api:
    build:
      context: .
      dockerfile: src/Services/GuestExperience/TakeTime.GuestExperience.API/Dockerfile
    container_name: taketime-guest-experience-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5007"
      ConnectionStrings__GuestExperienceDb: "Server=sqlserver;Database=TakeTime_GuestExperience_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "guest-experience-api"
      Service__Port: "5007"
    ports:
      - "${GUEST_EXPERIENCE_PORT:-5007}:5007"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Accounting Service
  # ===========================================================================

  accounting-api:
    build:
      context: .
      dockerfile: src/Services/Accounting/TakeTime.Accounting.API/Dockerfile
    container_name: taketime-accounting-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5008"
      ConnectionStrings__AccountingDb: "Server=sqlserver;Database=TakeTime_Accounting_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "accounting-api"
      Service__Port: "5008"
    ports:
      - "${ACCOUNTING_PORT:-5008}:5008"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5008/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Notification Service
  # ===========================================================================

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/TakeTime.Notification.API/Dockerfile
    container_name: taketime-notification-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5009"
      ConnectionStrings__NotificationDb: "Server=sqlserver;Database=TakeTime_Notification_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "notification-api"
      Service__Port: "5009"
      Notification__SMTP__Host: "${SMTP_HOST:-}"
      Notification__SMTP__Port: "${SMTP_PORT:-587}"
      Notification__SMTP__Username: "${SMTP_USERNAME:-}"
      Notification__SMTP__Password: "${SMTP_PASSWORD:-}"
      Notification__LINE__ChannelAccessToken: "${LINE_CHANNEL_ACCESS_TOKEN:-}"
      Notification__LINE__ChannelSecret: "${LINE_CHANNEL_SECRET:-}"
      Notification__SMS__Provider: "${SMS_PROVIDER:-}"
      Notification__SMS__ApiKey: "${SMS_API_KEY:-}"
    ports:
      - "${NOTIFICATION_PORT:-5009}:5009"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5009/health"]
      <<: *healthcheck-defaults

  # ===========================================================================
  # Affiliate Service
  # ===========================================================================

  affiliate-api:
    build:
      context: .
      dockerfile: src/Services/Affiliate/TakeTime.Affiliate.API/Dockerfile
    container_name: taketime-affiliate-api
    <<: *service-defaults
    environment:
      <<: *common-env
      ASPNETCORE_URLS: "http://+:5010"
      ConnectionStrings__AffiliateDb: "Server=sqlserver;Database=TakeTime_Affiliate_{TenantId};User Id=sa;Password=${SA_PASSWORD:-TakeTime_Str0ng!Pass};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False"
      Service__Name: "affiliate-api"
      Service__Port: "5010"
    ports:
      - "${AFFILIATE_PORT:-5010}:5010"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      <<: *healthcheck-defaults

# =============================================================================
# Networks
# =============================================================================

networks:
  taketime-network:
    driver: bridge
    name: taketime-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================

volumes:
  sqlserver-data:
    driver: local
    name: taketime-sqlserver-data
  redis-data:
    driver: local
    name: taketime-redis-data
  rabbitmq-data:
    driver: local
    name: taketime-rabbitmq-data
